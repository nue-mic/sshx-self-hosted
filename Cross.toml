# protoc for every cross build is provided from the host runner and forwarded
# into the container via this env passthrough (see the "Fetch protoc" step in
# .github/workflows/ci.yaml). This deliberately avoids installing anything with
# apt inside the cross images: on some base images an apt install pulls in
# tzdata, whose interactive configure prompt hangs the build forever (there is
# no TTY in the Docker build).
[build.env]
passthrough = ["PROTOC"]
