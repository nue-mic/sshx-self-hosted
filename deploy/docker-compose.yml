# Ready-to-use self-hosted sshx deployment (server + Redis + automatic HTTPS proxy).
#
# Quick start:
#   1. Point DNS A/AAAA records for sshx.rtxk.org (and optionally sshx.rtxk.us)
#      at this host's public IP.
#   2. Create a .env file next to this file with a fixed secret:
#        echo "SSHX_SECRET=$(openssl rand -hex 32)" > .env
#   3. Launch:
#        docker compose -f deploy/docker-compose.yml up -d
#
# Caddy automatically obtains and renews HTTPS certificates and reverse-proxies
# to the server over HTTP/2 cleartext (h2c), which is what sshx's gRPC needs.
# Redis persists live-session snapshots so that when the server (or the whole
# stack) restarts, clients reconnect and their sessions are restored instead of
# being dropped.

services:
  sshx-server:
    image: ghcr.io/nue-mic/sshx-self-hosted:latest
    restart: unless-stopped
    depends_on:
      - redis
    command:
      - ./sshx-server
      - --listen
      - "::"
      - --override-origin
      - https://sshx.rtxk.org
    environment:
      # A stable secret keeps session tokens and fixed per-machine URLs valid
      # across server restarts. Set it in a .env file (see the header). Required.
      SSHX_SECRET:
        ${SSHX_SECRET:?set SSHX_SECRET in a .env file next to this compose file}
      # Store live-session snapshots in Redis. On a server/container restart the
      # server restores sessions from Redis (within a 5-minute window), so open
      # sessions survive restarts and reconnecting clients pick up where they
      # left off. Single-server setups must NOT set --host (leave it unset).
      SSHX_REDIS_URL: redis://redis:6379
    expose:
      - "8051"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps snapshots on disk so they also survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - sshx-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
