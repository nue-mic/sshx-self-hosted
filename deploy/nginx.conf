# Standalone nginx reverse proxy for a self-hosted sshx server.
#
# Prerequisites
#   - sshx-server running and reachable at 127.0.0.1:8051 (adjust `upstream`
#     below; e.g. run the container with `-p 127.0.0.1:8051:8051`).
#   - TLS certificates for your domains (e.g. from certbot / Let's Encrypt).
#   - nginx 1.25+ for `http2 on;`. On older nginx, drop that line and use
#     `listen 443 ssl http2;` instead.
#
# Why the split locations: sshx serves the web app, WebSockets, and gRPC on a
# single port, distinguished by URL path. gRPC calls from the `sshx` CLI go to
# /sshx.SshxService/... , so those are handed to the backend with `grpc_pass`
# (HTTP/2), while everything else (web + WebSocket) uses `proxy_pass`.
#
# Install: drop this file in /etc/nginx/conf.d/sshx.conf and `nginx -s reload`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sshx_backend {
    server 127.0.0.1:8051;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sshx.rtxk.org sshx.rtxk.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sshx.rtxk.org sshx.rtxk.us;

    # TLS certificates — adjust paths to your setup (this example uses certbot).
    ssl_certificate     /etc/letsencrypt/live/sshx.rtxk.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sshx.rtxk.org/privkey.pem;

    # sshx sessions are long-lived (a gRPC Channel stream and WebSockets), so
    # raise the timeouts and lift the body-size limit.
    proxy_read_timeout   1h;
    proxy_send_timeout   1h;
    grpc_read_timeout    1h;
    grpc_send_timeout    1h;
    client_max_body_size 0;

    # gRPC traffic from the `sshx` command-line client.
    location /sshx.SshxService/ {
        grpc_pass grpc://sshx_backend;
    }
    location /grpc.reflection.v1.ServerReflection/ {
        grpc_pass grpc://sshx_backend;
    }
    location /grpc.reflection.v1alpha.ServerReflection/ {
        grpc_pass grpc://sshx_backend;
    }

    # Web app and WebSocket connections from browsers.
    location / {
        proxy_pass http://sshx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
