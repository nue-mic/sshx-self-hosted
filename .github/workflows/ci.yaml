name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel an in-progress run when a new commit is pushed to the same ref, so runs
# never pile up and hold onto runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rust format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install nightly --profile minimal -c rustfmt

      - run: cargo +nightly fmt -- --check

  rust:
    name: Rust lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

  windows_test:
    name: Client test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test -p sshx

  web:
    name: Web lint, check, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      - run: npm run build

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rustfmt, rust, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-latest,
              builder: native,
              server: true,
              archive: tar,
            }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-latest,
              builder: cross,
              server: true,
              archive: tar,
              protoc_host: true,
            }
          - {
              target: arm-unknown-linux-musleabihf,
              os: ubuntu-latest,
              builder: cross,
              server: true,
              archive: tar,
              protoc_host: true,
            }
          - {
              target: armv7-unknown-linux-musleabihf,
              os: ubuntu-latest,
              builder: cross,
              server: true,
              archive: tar,
              protoc_host: true,
            }
          - {
              target: x86_64-unknown-freebsd,
              os: ubuntu-latest,
              builder: cross,
              server: true,
              archive: tar,
              protoc_host: true,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              builder: cargo,
              server: true,
              archive: tar,
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-latest,
              builder: cargo,
              server: true,
              archive: tar,
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              builder: cargo,
              server: false,
              archive: zip,
            }
          - {
              target: i686-pc-windows-msvc,
              os: windows-latest,
              builder: cargo,
              server: false,
              archive: zip,
            }
          - {
              target: aarch64-pc-windows-msvc,
              os: windows-latest,
              builder: cargo,
              server: false,
              archive: zip,
            }

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        if: matrix.builder != 'cross'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Add Rust target
        if: matrix.builder != 'cross'
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl tools
        if: matrix.builder == 'native'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Fetch protoc for host-provided cross build
        if: matrix.protoc_host
        run: |
          mkdir -p .protoc
          curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.2/protoc-29.2-linux-x86_64.zip
          unzip -o /tmp/protoc.zip -d .protoc
          chmod +x .protoc/bin/protoc

      - name: Build (cross, host protoc)
        if: matrix.builder == 'cross' && matrix.protoc_host
        env:
          PROTOC: /project/.protoc/bin/protoc
        run:
          cross build --release --locked --target ${{ matrix.target }} --bin
          sshx ${{ matrix.server && '--bin sshx-server' || '' }}

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run:
          cargo build --release --locked --target ${{ matrix.target }} --bin
          sshx ${{ matrix.server && '--bin sshx-server' || '' }}

      - name: Build (native)
        if: matrix.builder == 'native'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run:
          cargo build --release --locked --target ${{ matrix.target }} --bin
          sshx --bin sshx-server

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          tar --no-xattrs -C target/${{ matrix.target }}/release -czf dist/sshx-${{ matrix.target }}.tar.gz sshx
          if [ "${{ matrix.server }}" = "true" ]; then
            tar --no-xattrs -C target/${{ matrix.target }}/release -czf dist/sshx-server-${{ matrix.target }}.tar.gz sshx-server
          fi

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/${{ matrix.target }}/release/sshx.exe -DestinationPath dist/sshx-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish versioned release
    runs-on: ubuntu-latest
    # Run even if some build targets fail, so one flaky platform does not block
    # publishing the rest.
    if:
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Determine version tag
        id: ver
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v${V}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Automated build ${{ steps.ver.outputs.tag }} from ${{ github.sha }}.
            Binaries for `sshx` (client) and `sshx-server`, served via the release
            proxy under key `sshx-self-releases`.
          prerelease: false
          make_latest: true
          files: dist/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rustfmt, rust, web]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
